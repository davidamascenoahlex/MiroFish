services:
  mirofish-backend:
    build:
      context: .
      target: backend
    image: mirofish-backend:local
    env_file:
      - .env
    environment:
      GUNICORN_BIND: 0.0.0.0:5001
    expose:
      - "5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

  mirofish-frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: /
    image: mirofish-frontend:local
    environment:
      BACKEND_URL: http://mirofish-backend:5001
    ports:
      - "3000:8080"
    depends_on:
      - mirofish-backend
    restart: unless-stopped
